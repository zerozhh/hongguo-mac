name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build Hongguo.app
        run: bash app/build.sh

      - name: Package
        run: |
          cd app/dist
          zip -qry ../../Hongguo.app.zip Hongguo.app

      - name: Attach artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Hongguo.app.zip
            scripts/setup_mac.command
          generate_release_notes: true
